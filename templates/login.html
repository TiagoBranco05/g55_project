{% extends "base.html" %}
{% block content %}
<div class="login-wrap">
  <div class="card">
    <div class="card-header"><h1>Login</h1></div>
    <form action="/chklogin" method="post">
      <div class="card-body">
        <div class="field">
          <label for="user">User:</label>
          <input type="text" id="user" name="user"
                 value="{{ user if user is defined else '' }}" autofocus>
        </div>
        <div class="field">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password">
        </div>
        {% if resul and resul != 'Valid' %}
        <p class="error-msg">{{ resul }}</p>
        {% endif %}
      </div>
      <div class="nav-group">
        <button type="submit" class="btn">Login</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
