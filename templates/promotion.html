{% extends "base.html" %}
{% block content %}
<div class="page">
  <div class="card">

    <div class="card-header">
      <h1> Promotion</h1>
      <span class="badge">id {{ promotion_id }}</span>
    </div>

    <div class="btn-group">
      <button class="btn btn-default" {{ butshow }}
              onclick="window.location.href='/promotion?option=edit'">Edit</button>
      <button class="btn btn-danger"  {{ butshow }}
              onclick="window.location.href='/promotion?option=delete'">Delete</button>
      <button class="btn btn-default" {{ butshow }}
              onclick="window.location.href='/promotion?option=insert'">Insert</button>
      <button class="btn btn-success" type="submit" form="form" {{ butedit }}>Save</button>
      <button class="btn btn-outline" {{ butedit }}
              onclick="window.location.href='/promotion?option=cancel'">Cancel</button>
      <button class="btn btn-outline"
              onclick="window.location.href='/promotion?option=exit'">Exit</button>
    </div>

    <form id="form" action="/promotion?option=save" method="post">
      <div class="card-body">

        <div class="field">
          <label for="promotion_id">Id:</label>
          {% if butedit == 'enabled' %}
            <input type="text" disabled id="promotion_id" name="promotion_id"
                   value="{{ promotion_id }}" size="10">
          {% else %}
            <input type="text" id="promotion_id" name="promotion_id"
                   value="{{ promotion_id }}" size="10">
          {% endif %}
        </div>

        <div class="field">
          <label for="name">Name:</label>
          <input {{ butedit }} type="text" id="name" name="name"
                 value="{{ name }}" size="40">
        </div>

        <div class="field">
          <label for="min_miles">Min Miles:</label>
          <input {{ butedit }} type="text" id="min_miles" name="min_miles"
                 value="{{ min_miles }}" size="10">
        </div>

        <div class="field">
          <label for="comments">Comments:</label>
          <input {{ butedit }} type="text" id="comments" name="comments"
                 value="{{ comments }}" size="40">
        </div>

        <div class="field">
          <label for="reward_id">Reward:</label>
          {% if butedit == 'enabled' %}
            <select id="reward_id" name="reward_id">
              {% for r in rewards %}
              <option value="{{ r.reward_id }}"
                {% if r.reward_id == reward_id %}selected{% endif %}>
                {{ r.reward_id }} — {{ r.name }}
              </option>
              {% endfor %}
            </select>
          {% else %}
            <input type="text" disabled value="{{ reward_id }}" size="10">
          {% endif %}
        </div>

      </div>
    </form>

    <div class="nav-group">
      <button class="btn btn-nav"
              onclick="window.location.href='/promotion?option=first'">First</button>
      <button class="btn btn-nav"
              onclick="window.location.href='/promotion?option=previous'">Previous</button>
      <button class="btn btn-nav"
              onclick="window.location.href='/promotion?option=next'">Next</button>
      <button class="btn btn-nav"
              onclick="window.location.href='/promotion?option=last'">Last</button>
    </div>

  </div>
</div>
{% endblock %}
